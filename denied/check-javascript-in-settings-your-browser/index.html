<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>JavaScript выключен — пиздец</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body {
            background-color: #0f0f0f;
            color: #fff;
            font-family: 'Courier New', monospace;
            text-align: center;
            padding: 50px;
            margin: 0;
            overflow: hidden;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
        }
        h1 {
            font-size: 28px;
            color: #ff3333;
            text-shadow: 0 0 10px rgba(255, 51, 51, 0.5);
        }
        p {
            font-size: 16px;
            line-height: 1.6;
        }
        .glitch {
            color: #00ffff;
            text-shadow: 2px 0 5px #ff9100;
            animation: glitch 2s infinite;
        }
        @keyframes glitch {
            0% { text-shadow: 2px 0 5px #ff9100; }
            50% { text-shadow: -2px 0 5px #00fff2; }
            100% { text-shadow: 2px 0 5px #ff9100; }
        }
        a {
            color: cyan;
            text-decoration: none;
            font-weight: bold;
        }
        a:hover {
            text-shadow: 0 0 10px cyan;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>💥 ПИЗДЕЦ</h1>
        <p class="glitch">JavaScript отключен</p>
        <p>
            Ты на современном сайте, а не в браузере 1998 года.<br>
            Включи JavaScript в настройках, иначе сайт не заработает.
        </p>
        <p>
            <strong>Как включить:</strong><br>
            Настройки → Конфиденциальность и безопасность → Сайты → JavaScript → Разрешить
        </p>
        <p>
            <a href="/">Повторить</a>
        </p>
    </div>
</body>
</html>
